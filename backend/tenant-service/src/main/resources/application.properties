spring.application.name=tenant-service

# 127.0.0.1 makes this learning service accessible only from your computer.
server.address=127.0.0.1
# 8081 gives this service a predictable port.
server.port=8081

# The health endpoint lets us check whether the application is running.
management.endpoints.web.exposure.include=health
# Health details stay hidden.
management.endpoint.health.show-details=never